<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AzzamOS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="desktop">
  <div class="os-logo"><span class="logo-mark">A</span><span>AzzamOS</span></div>
  <div class="icons">
    <button data-app="files">📁<small>Files</small></button>
    <button data-app="browser">🌐<small>Browser</small></button>
    <button data-app="settings">⚙️<small>Settings</small></button>
  </div>
  <div id="win" class="window hidden">
    <div class="bar"><b id="title">AzzamOS</b><span><button id="min">−</button><button id="close">×</button></span></div>
    <div id="content"></div>
  </div>
  <div id="start" class="start hidden">
    <div class="start-logo"><span class="logo-mark">A</span> AzzamOS</div>
    <button data-app="files">📁 Files</button>
    <button data-app="browser">🌐 Browser</button>
    <button data-app="settings">⚙️ Settings</button>
  </div>
  <div id="taskbar"><button id="startBtn">◉</button><span id="taskApp"></span><span id="clock"></span></div>
</div>
<script src="script.js"></script>
</body>
</html>
